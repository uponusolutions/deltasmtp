<!--
  The menu of all pages on gh-pages, inserted by inject-nav.sh: the benchmark
  pages at their site-nav marker comment, the coverage report of go tool cover
  right after the body tag. The root placeholder is the path to the site root.

  Links marked with ↗ open a page without this menu in a new tab, so the page
  with the menu stays open.
-->
<style>
  .site-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 20px;
    margin-bottom: 20px;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-secondary, #52514e);
  }
  .site-nav a { color: inherit; text-decoration: none; }
  .site-nav a:hover { text-decoration: underline; }
  .site-nav a[aria-current="page"] { color: var(--text-primary, #0b0b0b); font-weight: 600; }
  .site-nav .sep { width: 1px; height: 16px; background: var(--axis, #c3c2b7); }
  .site-nav .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  /* The coverage report: a bar above its own fixed bar with the file selector. */
  .site-nav:has(+ #topbar) {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1;
    height: 36px; margin: 0; padding: 0 12px;
    background: #1a1a19; color: #c3c2b7; border-bottom: 1px solid #383835;
    font-weight: normal;
  }
  .site-nav:has(+ #topbar) a[aria-current="page"] { color: #f0efec; }
  .site-nav:has(+ #topbar) .sep { background: #52514e; }
  .site-nav:has(+ #topbar) ~ #topbar { top: 37px; }
  .site-nav:has(+ #topbar) ~ #content { margin-top: 87px; }
  /* The report jumps to the shown file (location.hash), keep it below the bars. */
  .site-nav:has(+ #topbar) ~ #content .file { scroll-margin-top: 87px; }
</style>
<nav class="site-nav" aria-label="Pages">
  <a href="{{root}}dev/bench/" data-page="bench">Benchmarks</a>
  <a href="{{root}}dev/compare/" data-page="compare">Comparison with go-smtp</a>
  <a href="{{root}}coverage/" data-page="coverage">Coverage</a>
  <span class="sep" aria-hidden="true"></span>
  <a href="https://pkg.go.dev/github.com/uponusolutions/deltasmtp" target="_blank" rel="noopener"
     title="Opens pkg.go.dev in a new tab, without this menu">Docs <span aria-hidden="true">↗</span><span class="sr"> (opens in a new tab)</span></a>
  <a href="https://github.com/uponusolutions/deltasmtp" target="_blank" rel="noopener"
     title="Opens GitHub in a new tab, without this menu">Repository <span aria-hidden="true">↗</span><span class="sr"> (opens in a new tab)</span></a>
</nav>
