version: "2"
linters:
  # Added on top of the standard set (errcheck, govet, ineffassign, staticcheck, unused).
  enable:
    # Security issues like weak crypto, unchecked conversions or unsafe file access.
    - gosec
    # Style and correctness rules, configured below.
    - revive
    # Unchecked errors, part of the standard set, listed for its settings below.
    - errcheck
    # Line length, see the settings below.
    - lll
    # Errors must be compared with errors.Is/As and wrapped with %w. Status errors are
    # handed to callers and backends, a == or a type assertion misses a wrapped one.
    - errorlint
    # Correct testify usage, e.g. require.Len instead of comparing len() or
    # require.ErrorIs instead of require.Error with a target.
    - testifylint
    # Common English misspellings in comments and strings.
    - misspell
    # Unnecessary type conversions.
    - unconvert
    # fmt calls that can be replaced by faster strconv or string functions.
    - perfsprint
    # nolint directives must be well formed, name the linter, give a reason and still
    # suppress something. A malformed directive like "// nolint" is silently ignored.
    - nolintlint
  settings:
    lll:
      line-length: 120
      # A tab counts as one character.
      tab-width: 1
    errcheck:
      exclude-functions:
        # Removing a temporary file is best effort.
        - os.Remove
    nolintlint:
      require-specific: true
      require-explanation: true
    testifylint:
      disable:
        # assert after an error is used on purpose: loops report every failing item
        # and cleanup checks run after the main assertion.
        - require-error
    revive:
      enable-all-rules: true
      rules:
        # Rules with adjusted limits.
        - name: banned-characters
          arguments: [Ω, Σ, σ]
        - name: function-result-limit
          arguments: [4]
        - name: function-length
          # Max statements, max lines.
          arguments: [80, 200]
        - name: cognitive-complexity
          arguments: [40]
        - name: argument-limit
          arguments: [8]
        # Disabled rules.
        # Anonymous structs are used for local grouping, e.g. table tests.
        - name: nested-structs
          disabled: true
        # Import aliases are allowed even if they match the package name.
        - name: redundant-import-alias
          disabled: true
        # Covered by lll.
        - name: line-length-limit
          disabled: true
        # cognitive-complexity is used instead, cyclomatic complexity punishes flat switches.
        - name: cyclomatic
          disabled: true
        # No license header is required in each file.
        - name: file-header
          disabled: true
        # Packages are organized by responsibility, not by the number of public structs.
        - name: max-public-structs
          disabled: true
        # Protocol codes and limits are clearer as literals next to their RFC comment.
        - name: add-constant
          disabled: true
        # Unchecked errors are covered by errcheck.
        - name: unhandled-error
          disabled: true
        # Allows comments like //go:build or commented out code without a space.
        - name: comment-spacings
          disabled: true
        # Not every package has a package comment.
        - name: package-comments
          disabled: true
        # Boolean options are part of the API, e.g. pipelining or last chunk flags.
        - name: flag-parameter
          disabled: true
        # break in a switch case is used for clarity.
        - name: useless-break
          disabled: true
        # Variables may share a name with an imported package.
        - name: import-shadowing
          disabled: true
        # Examples and tests may call os.Exit or log.Fatal.
        - name: deep-exit
          disabled: true
        # Names like Id or Url in existing APIs are kept.
        - name: var-naming
          disabled: true
        # Explicit zero values and types in var declarations are allowed.
        - name: var-declaration
          disabled: true
        # Methods may differ only in capitalization, e.g. an exported and an internal variant.
        - name: confusing-naming
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Function signatures can't be wrapped nicely.
      - linters: [lll]
        source: "^func|func\\("
      - linters: [lll]
        source: "^//go:generate "
      # G402: tests connect to self-signed test servers with InsecureSkipVerify.
      # G404: tests use seeded generators, a failing seed or payload can be reproduced.
      - linters: [gosec]
        path: _test\.go
        text: G402|G404
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
