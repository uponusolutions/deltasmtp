name: Benchmark
on:
  push:
    branches:
      - main

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run benchmark
        run: export NOSETBYTES=TRUE && go test ./benchmark -bench . -benchtime=10s -run ^$ | tee output.txt
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "go"
          output-file-path: output.txt
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          alert-comment-cc-users: "@ml1nk"

  compare:
    name: Compare with go-smtp
    # Runs after the benchmark job, both push to gh-pages.
    needs: benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark/compare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: benchmark/compare/go.mod
          cache-dependency-path: benchmark/compare/go.sum
      - name: Run benchmark
        run: go test . -bench . -benchtime=10s -run ^$ | tee output.txt
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "Compare with go-smtp"
          tool: "go"
          output-file-path: benchmark/compare/output.txt
          # Separate page next to the benchmark page (dev/bench).
          benchmark-data-dir-path: dev/compare
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Commits data.js to the local gh-pages branch only, the next step
          # adds the page and pushes both.
          auto-push: false
      - name: Publish comparison page
        # The page of the action shows every benchmark on its own, this one
        # compares the implementations. The action only creates index.html if
        # it is missing, so it never overwrites this one.
        run: |
          git worktree add "$RUNNER_TEMP/gh-pages" gh-pages
          cp index.html "$RUNNER_TEMP/gh-pages/dev/compare/index.html"
          cd "$RUNNER_TEMP/gh-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/compare/index.html
          git diff --cached --quiet || git commit -m "update comparison page"
          # Other workflows push to gh-pages as well.
          for i in 1 2 3 4 5; do
            git push origin gh-pages:gh-pages && exit 0
            git pull --rebase origin gh-pages
          done
          exit 1
